name: Docker quick test

# Builds the Dockerfile and runs a short version of the example (2 replicates, 2011-2021).
# Run it manually: GitHub > Actions > "Docker quick test" > Run workflow.
on:
  workflow_dispatch:
  push:
    paths: [Dockerfile, .dockerignore, runMe.R, .github/workflows/docker-quick-test.yml]

jobs:
  quick-test:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build image
        run: docker build -t anthrodist-demo .
      - name: Run the quick example
        run: |
          mkdir -p outputs
          set +e
          docker run --rm -e ADS_END_YEAR=2021 -e ADS_N_REPLICATES=2             -v "$PWD/outputs:/anthropogenicDisturbance_Demo/outputs" anthrodist-demo 2>&1 | tee container.log
          rc=${PIPESTATUS[0]}
          # surface the container's error lines as annotations (visible on the run summary page)
          grep -E "^Error|Error in|Execution halted|there is no package|cannot open" container.log | head -8 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
          echo "::notice::container exit code $rc; last lines: $(tail -n 6 container.log | tr '
' '|' | cut -c1-400)"
          exit $rc
      - name: Check that the results exist
        run: |
          ls outputs | head -30
          test -f outputs/Figure2.png
          ls -d outputs/NT_0.2_run0*_North outputs/NT_0.2_run0*_South
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-test-outputs
          path: |
            outputs/Figure2.png
            container.log
